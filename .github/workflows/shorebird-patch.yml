name: Shorebird Patch

# Manual only: publishes a code-push patch for an existing Shorebird release (no new APK).
# --allow-build-flag-diffs: the define file has the same APP_KEY as the release; only its temp path/handling differs.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Shorebird release to patch'
        default: '1.0.0+1'
        required: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Check signing files (keystore is in the repo, no Actions secrets)
        run: |
          set -euo pipefail
          test -f android/signing/satlok.keystore
          test -f android/key.properties
          test -f android/app/google-services.json

      - name: Publish patch
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set +x
          args=""
          if [ -n "$APP_KEY" ]; then
            printf '{"APP_KEY":"%s"}' "$APP_KEY" > "$RUNNER_TEMP/dd.json"
            args="--dart-define-from-file=$RUNNER_TEMP/dd.json"
          fi
          shorebird patch android --release-version "${{ inputs.release_version }}" --allow-asset-diffs --allow-build-flag-diffs $args
